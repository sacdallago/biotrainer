[project]
name = "biotrainer"
version = "1.4.0"
description = "Biological prediction models made simple."
authors = [
    {name = "Sebastian Franz", email = "sebastian.franz@tum.de"},
    {name = "Christian Dallago", email = "christian.dallago@tum.de"},
    {name = "Joaquin Gomez Sanchez", email = "joaquin.gomez@tum.de"},
    {name = "Michael Heinzinger", email = "mheinzinger@rostlab.org"}
]
license = {text = "AFL v3.0"}
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Academic Free License (AFL)",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization"
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.14.0,<2.0.0",
    "h5py>=3.15.0,<4.0.0",
    "numpy>=2.4.1,<2.6.0",
    "ruamel.yaml>=0.17.40,<0.18.0",
    "sentencepiece>=0.2.0",
    "scipy>=1.17.1",
    "scikit-learn>=1.5.1",
    "tensorboard>=2.21.0,<2.22.0",
    "torch>=2.11.0,<3.0.0",
    "gpytorch>=1.15.2,<2.0",
    "tqdm>=4.67.3,<5.0.0",
    "torchmetrics>=1.9.0",
    "safetensors>=0.4.4",
    "onnx>=1.22.0,<1.23.0",
    "onnxscript>=0.7.0,<0.8.0",
    "datasets>=4.8.0,<5.0.0",
    "umap-learn>=0.5.7,<0.6.0",
    "llvmlite>=0.46.0,<0.49.0",
    "cyclopts>=4.22.0,<4.23.0",
    "appdirs>=1.4.4",
    "peft>=0.18.1,<0.20.0",
    "aaanalysis>=1.0.3,<1.1.0",
    "blosum>=2.2.0,<2.3.0",
    "pydantic>=2.12.0,<2.15.0",
    "biotrainer-core>=0.1.0",
    "junban>=1.0.3,<1.1.0",
    "einops>=0.8.2,<0.9.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyter>=1.1.1,<1.2.0",
    "notebook>=7.4.0,<7.7.0",
]
onnx-cpu = ["onnxruntime>=1.25.0,<1.30.0"]
onnx-gpu = ["onnxruntime>=1.25.0,<1.30.0"]
onnx-mac = ["onnxruntime>=1.25.0,<1.30.0"]  # Replace with cpu ["onnxruntime>=1.21.0"] if coreml doesn't work on your Mac
dev = [
    "pytest>=9.1.1,<9.2.0",
    "build>=1.5.0,<2.0.0",
    "pip-audit>=2.10.0,<2.11.0",
]
autoeval-frontend = [
    "streamlit>=1.60.0,<1.61.0",
    "altair>=6.2.2,<6.3.0"
]
esm-c = [
    "esm>=3.3.0,<3.4.0", # This will try to pull from PyPI if available, otherwise falls back to git
    "xformers>=0.0.35,<0.1.0"
]

[project.urls]
Issues = "https://github.com/sacdallago/biotrainer/issues"
Repository = "https://github.com/sacdallago/biotrainer"

[project.scripts]
biotrainer = "biotrainer.utilities.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["biotrainer"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.3.4",
    "build>=1.2.2",
]

[tool.uv.workspace]
members = [
    "biotrainer-core",
]

[tool.uv.sources]
biotrainer-core = { workspace = true }
esm = { git = "https://github.com/Biohub/esm.git", branch = "main" }
